services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: freshness
      POSTGRES_USER: freshness_user
      POSTGRES_PASSWORD: freshness_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://freshness_user:freshness_password@db:5432/freshness
      JWT_SECRET: change-this-secret-in-production
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      # Mount the trained model into the container so training done on the host
      # is available without rebuilding the Docker image
      - ./backend/app/ml/saved_models:/app/app/ml/saved_models

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
